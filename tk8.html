<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài tập K8 - Tính BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Bài tập K8: Tính Chỉ Số BMI và Phân Loại</h2>
        <label>Cân nặng (kg):</label><br>
        <input type="number" id="weight" step="0.1" placeholder="Ví dụ: 60"><br><br>
        <label>Chiều cao (m):</label><br>
        <input type="number" id="height" step="0.01" placeholder="Ví dụ: 1.7"><br><br>
        <button onclick="calculateBMI()">Tính BMI</button>
        <p>Kết quả: <strong id="bmiResult">-</strong></p>
        <br><p><a href="bt36.html">&larr; Quay lại trang chủ</a></p>
    </div>
    <script>
        function calculateBMI() {
            let w = parseFloat(document.getElementById("weight").value);
            let h = parseFloat(document.getElementById("height").value);
            if (!w || !h || h <= 0) {
                document.getElementById("bmiResult").innerText = "Vui lòng nhập số liệu hợp lệ!";
                return;
            }
            let bmi = w / (h * h);
            let classification = "";
            if (bmi < 18.5) {
                classification = "Thiếu cân";
            } else if (bmi < 24.9) {
                classification = "Bình thường";
            } else {
                classification = "Thừa cân";
            }
            document.getElementById("bmiResult").innerText = `BMI = ${bmi.toFixed(2)} (${classification})`;
        }
    </script>
</body>
</html>
